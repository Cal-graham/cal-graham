name: Build and Deploy to GitHub Pages
 
on:
  push:
    branches:
      - main  # Set this to your default branch name

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build
          touch dist/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite builds into 'dist'. Use 'build' if using CRA.
          branch: gh-pages
          clean: true
